# ============================================================
# 基础档案示例（profile.example.yml）
#
# 用法：复制本文件为 config/profile.yml，替换为你的真实信息。
# 本文件是简历骨架的权威数据源；AI 写作/选材时只读取，不修改。
#
# 结构说明见各段注释。字段保持同名，值替换为你的真实内容即可。
# ⚠️ 本示例内容为虚构，仅演示结构，严禁直接使用。
# ============================================================

# 基本信息（简历头部）
basic_info:
  name: 张三
  title: "产品经理"                 # 当前职级/头衔
  years_of_experience: 6            # 工作年限（数字）
  phone: "13800000000"
  email: "zhangsan@example.com"
  employment_status: 在职            # 在职 / 已离职（影响面试话术，简历头部不展示）
  available_date: 一个月内到岗
  education:
    # 学历输出格式：学校 | 专业 | 学位 | 时间。degree 原样使用，禁止加括号注释（非全/在职信息不在简历展示，面试时说明）
    records:
      - school: 某某大学
        major: 计算机科学与技术
        degree: 本科
        period: "2015.09 - 2019.06"

# ============================================================
# 职业阶段（时间线铁律：AI 不得改动任职期/职位/归属）
#   company  公司名（需与 project-library.md 中的归属一致）
#   period   任职期（YYYY.MM - YYYY.MM 或 "至今"）
#   role     职位
#   stage_label 阶段定位（如 职业起点/关键转型/能力深化，用于自我介绍串联）
#   narrative   该段一句话概述（用于职业路径叙事）
#   base_note   该段固定内容基线（简历中必须体现的职责与成果，不随 JD 变化）
# ============================================================
career_stages:
  - company: 甲公司
    period: "2022.03 - 至今"
    role: 产品经理
    stage_label: 能力深化
    narrative: 负责核心业务线产品规划与迭代，覆盖需求到交付的全流程
    base_note: >-
      甲公司段固定主体 = 核心业务线产品（对应项目库中该公司下的固定项目）；
      简历写作时该段必须保留其核心职责与成果，允许再按 JD 组合同时段的增量项目。

  - company: 乙公司
    period: "2019.07 - 2022.02"
    role: 产品助理
    stage_label: 职业起点
    narrative: 从执行做起，建立需求管理与跨团队协作基础
    base_note: 项目库中该公司下的项目（按需保留）

# ============================================================
# 项目分组策略（决定各公司段在简历中的组装方式）
#
#   fixed          固定保留：该段默认必保留的项目池，不随 JD 变化
#   fixed_display  可选：从 fixed 池中实际呈现几个（如 1-2）；未配置则全部呈现
#   incremental    增量挑选：该段按 JD 相关性挑选的项目
#
# 未列入本配置的公司段：其全部项目按 JD 匹配度自由选材（无固定保留项）。
# 项目名需与 references/project-library.md 中完全一致。
# ============================================================
project_grouping:
  - company: 甲公司
    fixed: [项目A, 项目B]
    fixed_display: 1-2      # 从 fixed 池中呈现 1-2 个（多个时合并为「项目一」）
    incremental: [项目C]
  # 乙公司未配置 → 其项目全部按 JD 匹配度自由选材

# ============================================================
# 简历结构（模块顺序/命名/取舍）——可自由调整
#
# 不配置时用默认顺序：header → summary → work_experience → education → skills
#
# 可用模块 id：
#   header            姓名/联系方式/求职意向（固定建议放首位）
#   summary           核心优势
#   work_experience   工作经历
#   project_experience 项目经历（个人项目/强匹配项目，不受时间序限制）
#   education         教育背景
#   skills            专业技能
#
# 写法：
#   - 字符串："education"                        → 用默认标题
#   - 字典：  {id: "summary", title: "个人优势"}  → 自定义标题
#   - 字典：  {id: "education", sep: false}       → 控制该模块前是否加分隔线
#   - 从列表中删除某模块 → 简历不输出该模块
#
# 例（教育前置 + 改名 + 去掉技能）：
#   resume_layout: [header, {id: summary, title: 个人优势}, education, work_experience]
#
# 也可在简历 JSON 里用 `layout` 临时覆盖（按 JD 微调，不改本档案）。
# ============================================================
resume_layout:
  - header
  - summary
  - work_experience
  - education
  - skills

# ============================================================
# 个人优势维度库（简历「核心优势」的 label 白名单 + 能力素材）
#
#   写简历时选 3-4 条（最多 4 条），按 JD 组合：
#   - 选：优先 applicable 命中当前 JD 岗位类型的维度；无命中用「通用」维度兜底
#   - 标签锁定 name（AI 不得新造维度名）
#   - content 是能力主张底稿，输出时按 JD 加工（调侧重 → 数据前置 → 注入关键词 → 压缩）
#   - 能力面描述为主，可点缀量化数据，不堆项目论据（论据留给工作经历）
#   - AI 类 JD 建议含一条 AI 相关维度
#
# applicable 取值可自定（如 增长/策略/商业化/B端/平台/AI/通用），与 JD 判定类型对齐。
# ============================================================
personal_advantage:
  dimensions:
    - name: 全链路交付力
      content: 贯穿需求洞察、产品设计、开发落地到效果验证，以数据驱动定位问题、验证策略
      applicable: [通用]
    - name: 数据分析与增长能力
      content: 建立数据监控体系，通过漏斗分析与 AB 实验定位增长机会，推动核心指标提升
      applicable: [增长, 策略, 数据]
    - name: 跨团队协作与交付能力
      content: 主导跨部门协作推进项目落地，把控进度与质量，保障按时交付
      applicable: [通用]

# ============================================================
# 核心工具栈（简历「专业技能」模块的数据源，静态维护）
#   输出时按「工具 | 能力 | 认证」三层组装；
#   AI 仅按 JD 排序/裁剪（JD 强调的排前、无关的删），不新增未列入的技能。
# ============================================================
tool_stack:
  # tools：核心工具栈。
  # 可选：在工具名后加括号写熟练度，编辑器会渲染成 5 点等级点阵（详见 ENVIRONMENT.md）。
  #   等级可用词：精通 / 熟练 / 熟悉 / 掌握 / 了解 / 入门（熟悉与掌握同为 3 档），也可直接写 1-5。
  #   不写等级就只显示名称；括号里不是等级词的（如 Figma（协作））会原样保留在名称里。
  tools:
    - Axure（熟练）
    - Figma
    - XMind（了解）
  capabilities:
    - 需求分析与 PRD 撰写
    - 原型与业务流程图设计
    - 跨团队项目推进
  certifications: []          # 无认证则留空列表
